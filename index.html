<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuClear AI - Enterprise Contract Risk Auditor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #030816;
      color: #f8fafc;
    }
    .brand-blue {
      color: #0ea5e9;
    }

    /* Print & PDF Export Optimization */
    .print-only-report {
      display: none;
    }

    @media print {
      @page {
        margin: 12mm 15mm;
        size: A4 portrait;
      }
      body {
        background-color: #ffffff !important;
        color: #0f172a !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-report {
        display: block !important;
      }
      .report-card {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body class="font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      const [loading, setLoading] = useState(false);
      const [audited, setAudited] = useState(false);
      const [riskScore, setRiskScore] = useState(88);
      const [acceptedClauses, setAcceptedClauses] = useState([]);
      const [fileName, setFileName] = useState("Sample_Vendor_Contract_MSA.pdf");
      const fileInputRef = useRef(null);

      const findings = [
        {
          clause_id: "SEC-8.2",
          clause_name: "Indemnification & Consequential Damages",
          original_text: "Vendor agrees to unlimited, uncapped indemnification for any indirect or consequential damages arising under this agreement.",
          risk_level: "CRITICAL",
          risk_category: "INDEMNIFICATION",
          reasoning: "Uncapped consequential liability creates unbounded financial exposure without insurance backstop.",
          proposed_redline: "Vendor's aggregate liability for indemnification claims shall not exceed 2x the total fees paid in the preceding 12 months."
        },
        {
          clause_id: "SEC-14.1",
          clause_name: "Termination Without Cause",
          original_text: "Customer may terminate this agreement at will with 24 hours prior notice without cause or early termination fee.",
          risk_level: "MODERATE",
          risk_category: "TERMINATION",
          reasoning: "Asymmetrical 24-hour termination without cause disrupts cash flow and resource planning.",
          proposed_redline: "Either party may terminate this agreement upon 30 days prior written notice, subject to settlement of unbilled accrued charges."
        },
        {
          clause_id: "SEC-19.4",
          clause_name: "Pre-existing Core Intellectual Property",
          original_text: "All intellectual property created or derived during the performance of services transfers entirely to Customer upon inception.",
          risk_level: "CRITICAL",
          risk_category: "IP_RIGHTS",
          reasoning: "Assigns pre-existing vendor core tooling and IP without standard vendor background carve-outs.",
          proposed_redline: "Customer owns custom client deliverables; Vendor retains all rights in pre-existing tools, algorithms, and core IP."
        }
      ];

      const handleFileSelect = (e) => {
        if (e.target.files && e.target.files[0]) {
          setFileName(e.target.files[0].name);
        }
      };

      const handleSimulateAudit = () => {
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          setAudited(true);
          setRiskScore(88);
          setAcceptedClauses([]);
        }, 500);
      };

      const handleAcceptRedline = (clauseId) => {
        if (!acceptedClauses.includes(clauseId)) {
          const updated = [...acceptedClauses, clauseId];
          setAcceptedClauses(updated);
          setRiskScore(Math.max(16, 88 - (updated.length * 24)));
        }
      };

      const handleAcceptAll = () => {
        setAcceptedClauses(findings.map(f => f.clause_id));
        setRiskScore(16);
      };

      return (
        <div>
          {/* SCREEN DISPLAY */}
          <div className="no-print min-h-screen flex flex-col">
            <header className="border-b border-[#0f1d38] bg-[#030816]/90 px-8 py-5 flex justify-between items-center">
              <div className="flex items-center space-x-2">
                <span className="text-2xl font-black tracking-tight brand-blue">DocuClear</span>
                <span className="text-2xl font-black tracking-tight text-white">AI</span>
              </div>
              
              <div className="flex items-center space-x-4">
                {audited && (
                  <>
                    <div className="flex items-center space-x-2 mr-2">
                      <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Contract Risk Score:</span>
                      <span className={`text-base font-black px-3 py-1 rounded-md ${riskScore > 50 ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'}`}>
                        {riskScore} / 100
                      </span>
                    </div>
                    
                    <button 
                      onClick={handleAcceptAll}
                      className="bg-[#2563eb] hover:bg-[#1d4ed8] text-white text-xs font-bold px-3.5 py-2 rounded-lg transition"
                    >
                      ⚡ Accept All High Risks
                    </button>

                    <button 
                      onClick={() => window.print()}
                      className="bg-[#0f1d38] hover:bg-[#1e293b] text-slate-200 text-xs font-bold px-3.5 py-2 rounded-lg border border-[#1e3a8a]/50 transition"
                    >
                      📥 Export Audit Report
                    </button>
                  </>
                )}
                <span className="text-xs tracking-wider uppercase font-mono font-bold bg-[#0b1739] text-[#60a5fa] border border-[#1e3a8a] px-3.5 py-1.5 rounded-full">
                  ENTERPRISE AUDIT ENGINE
                </span>
              </div>
            </header>

            {!audited ? (
              <main className="flex-1 flex flex-col items-center justify-center px-4 -mt-8">
                <h1 className="text-4xl font-extrabold text-white tracking-tight mb-3">
                  Enterprise Contract Risk Auditor
                </h1>
                <p className="text-slate-400 text-sm mb-8 text-center max-w-xl">
                  Upload or audit vendor contracts to extract hidden indemnity traps and generate balanced redlines in seconds.
                </p>

                <div className="w-full max-w-2xl border-2 border-dashed border-[#1e3a8a]/60 bg-[#07112c]/50 rounded-2xl p-10 flex flex-col items-center justify-center text-center">
                  <input 
                    type="file" 
                    ref={fileInputRef} 
                    onChange={handleFileSelect} 
                    accept=".pdf,.docx,.txt" 
                    className="hidden" 
                  />

                  <div className="flex items-center space-x-2 text-slate-200 font-semibold mb-2 text-base">
                    <span className="text-xl">📄</span>
                    <span className="font-mono text-cyan-400">{fileName}</span>
                  </div>

                  <div className="flex items-center gap-3 mb-6">
                    <button
                      type="button"
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      className="text-xs bg-[#0b1739] hover:bg-[#15275a] text-slate-300 border border-[#1e3a8a] px-3 py-1.5 rounded-md font-medium transition"
                    >
                      📁 Choose Custom Contract File
                    </button>
                    <button
                      type="button"
                      onClick={() => setFileName("Sample_Vendor_Contract_MSA.pdf")}
                      className="text-xs text-slate-400 hover:text-slate-200 underline font-medium"
                    >
                      Reset to Default MSA
                    </button>
                  </div>

                  <button
                    onClick={handleSimulateAudit}
                    disabled={loading}
                    className="bg-[#2563eb] hover:bg-[#1d4ed8] text-white font-bold text-sm px-7 py-3 rounded-lg shadow-lg shadow-blue-600/30 flex items-center space-x-2 transition"
                  >
                    <span>{loading ? 'Analyzing with Azure AI...' : 'Run Live Contract Audit'}</span>
                    <span>⚡</span>
                  </button>
                </div>
              </main>
            ) : (
              <main className="flex-1 p-6 grid grid-cols-12 gap-6">
                <section className="col-span-6 bg-[#07112c]/70 border border-[#1e293b] rounded-2xl p-6 flex flex-col h-[calc(100vh-120px)]">
                  <div className="flex justify-between items-center mb-4 pb-3 border-b border-[#1e293b]">
                    <h2 className="text-sm font-bold flex items-center gap-2 text-slate-200">
                      📄 Active File: <span className="font-mono text-cyan-400">{fileName}</span>
                    </h2>
                    <button
                      onClick={() => setAudited(false)}
                      className="bg-[#0b1739] hover:bg-[#1e293b] text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-[#1e3a8a]/40 transition"
                    >
                      📂 Audit Another File
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-4 pr-2 text-sm leading-relaxed text-slate-300">
                    <p className="font-mono text-xs text-slate-500 uppercase tracking-widest font-semibold">
                      AUDITED AGREEMENT - CLAUSE EXCERPTS
                    </p>
                    
                    <div className={`p-4 rounded-xl border transition ${acceptedClauses.includes('SEC-8.2') ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-red-950/20 border-red-500/30'}`}>
                      <span className="text-xs font-mono font-bold text-slate-400">Clause 8.2 (Indemnification):</span>
                      {acceptedClauses.includes('SEC-8.2') ? (
                        <p className="text-emerald-300 mt-1 font-sans"><ins>Vendor's aggregate liability for indemnification claims shall not exceed 2x the total fees paid in the preceding 12 months.</ins></p>
                      ) : (
                        <p className="text-red-300 mt-1 font-sans"><del>Vendor agrees to unlimited, uncapped indemnification for any indirect or consequential damages arising under this agreement.</del></p>
                      )}
                    </div>

                    <div className={`p-4 rounded-xl border transition ${acceptedClauses.includes('SEC-14.1') ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-amber-950/20 border-amber-500/30'}`}>
                      <span className="text-xs font-mono font-bold text-slate-400">Clause 14.1 (Termination):</span>
                      {acceptedClauses.includes('SEC-14.1') ? (
                        <p className="text-emerald-300 mt-1 font-sans"><ins>Either party may terminate this agreement upon 30 days prior written notice, subject to settlement of unbilled accrued charges.</ins></p>
                      ) : (
                        <p className="text-amber-300 mt-1 font-sans"><del>Customer may terminate this agreement at will with 24 hours prior notice without cause or early termination fee.</del></p>
                      )}
                    </div>

                    <div className={`p-4 rounded-xl border transition ${acceptedClauses.includes('SEC-19.4') ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-red-950/20 border-red-500/30'}`}>
                      <span className="text-xs font-mono font-bold text-slate-400">Clause 19.4 (Intellectual Property):</span>
                      {acceptedClauses.includes('SEC-19.4') ? (
                        <p className="text-emerald-300 mt-1 font-sans"><ins>Customer owns custom client deliverables; Vendor retains all rights in pre-existing tools, algorithms, and core IP.</ins></p>
                      ) : (
                        <p className="text-red-300 mt-1 font-sans"><del>All intellectual property created or derived during the performance of services transfers entirely to Customer upon inception.</del></p>
                      )}
                    </div>
                  </div>
                </section>

                <section className="col-span-6 bg-[#07112c]/70 border border-[#1e293b] rounded-2xl p-6 flex flex-col h-[calc(100vh-120px)]">
                  <div className="flex justify-between items-center mb-4 pb-3 border-b border-[#1e293b]">
                    <h2 className="text-sm font-bold flex items-center gap-2 text-slate-200">
                      ⚡ Real-Time Redline Engine
                    </h2>
                    <span className="text-xs font-mono text-cyan-400">Azure OpenAI Structured JSON</span>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-4 pr-2">
                    {findings.map((finding) => {
                      const isAccepted = acceptedClauses.includes(finding.clause_id);
                      return (
                        <div key={finding.clause_id} className={`p-4 rounded-xl border transition ${isAccepted ? 'bg-[#030816]/40 border-slate-800 opacity-60' : 'bg-[#0b1739]/60 border-[#1e293b]'}`}>
                          <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-xs font-bold text-slate-300">{finding.clause_id}</span>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${finding.risk_level === 'CRITICAL' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                                {finding.risk_level}
                              </span>
                            </div>
                            
                            <button
                              onClick={() => handleAcceptRedline(finding.clause_id)}
                              disabled={isAccepted}
                              className={`text-xs px-3 py-1 rounded-md font-semibold transition ${isAccepted ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 cursor-default' : 'bg-[#2563eb] hover:bg-[#1d4ed8] text-white'}`}
                            >
                              {isAccepted ? '✓ Accepted' : 'Apply Redline →'}
                            </button>
                          </div>

                          <p className="text-xs text-slate-400 mb-3">{finding.reasoning}</p>

                          <div className="bg-[#030816] p-3 rounded-lg border border-[#1e293b] font-mono text-xs text-emerald-300">
                            <span className="text-[10px] text-slate-500 block uppercase font-sans mb-1 font-bold">Proposed Redline:</span>
                            {finding.proposed_redline}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>
              </main>
            )}
          </div>

          {/* PRINT / PDF EXPORT TEMPLATE */}
          <div className="print-only-report text-slate-900 bg-white">
            <div className="flex justify-between items-end border-b-2 border-slate-900 pb-4 mb-6">
              <div>
                <h1 className="text-2xl font-black tracking-tight text-slate-900">
                  DocuClear <span className="text-blue-600">AI</span>
                </h1>
                <p className="text-xs text-slate-500 font-semibold tracking-wider uppercase mt-0.5">
                  Autonomous Enterprise Legal & Risk Intelligence
                </p>
              </div>
              <div className="text-right">
                <span className="text-xs font-mono font-bold bg-slate-100 border border-slate-300 text-slate-800 px-2.5 py-1 rounded">
                  AUDIT ID: DCR-2026-X88
                </span>
                <p className="text-[10px] text-slate-500 mt-1">Generated: {new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</p>
              </div>
            </div>

            <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-6 report-card">
              <div className="grid grid-cols-4 gap-4">
                <div>
                  <span className="text-[10px] uppercase font-bold text-slate-400 block tracking-wider">Target Contract</span>
                  <span className="text-xs font-semibold text-slate-900 font-mono">{fileName}</span>
                </div>
                <div>
                  <span className="text-[10px] uppercase font-bold text-slate-400 block tracking-wider">Clauses Scanned</span>
                  <span className="text-xs font-semibold text-slate-900">14 Provisions</span>
                </div>
                <div>
                  <span className="text-[10px] uppercase font-bold text-slate-400 block tracking-wider">Initial Risk</span>
                  <span className="text-xs font-bold text-red-600">88 / 100 (Critical)</span>
                </div>
                <div>
                  <span className="text-[10px] uppercase font-bold text-slate-400 block tracking-wider">Post-Mitigation</span>
                  <span className={`text-xs font-bold ${riskScore > 50 ? 'text-red-600' : 'text-emerald-700'}`}>
                    {riskScore} / 100 ({acceptedClauses.length} Resolved)
                  </span>
                </div>
              </div>
            </div>

            <h2 className="text-sm font-bold text-slate-900 uppercase tracking-wider mb-4 border-b border-slate-200 pb-2">
              Executive Clause Audit & Mitigation Schedule
            </h2>

            <div className="space-y-4">
              {findings.map((finding) => {
                const isResolved = acceptedClauses.includes(finding.clause_id);
                return (
                  <div key={finding.clause_id} className="border border-slate-300 rounded-lg p-4 report-card bg-white shadow-none">
                    <div className="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-bold font-mono text-slate-900">{finding.clause_id}</span>
                        <span className="text-xs font-semibold text-slate-700">— {finding.clause_name}</span>
                      </div>
                      <div className="flex items-center space-x-2">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${finding.risk_level === 'CRITICAL' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-amber-50 text-amber-800 border-amber-200'}`}>
                          {finding.risk_level} RISK
                        </span>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${isResolved ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                          {isResolved ? 'MITIGATED' : 'FLAGGED'}
                        </span>
                      </div>
                    </div>

                    <p className="text-xs text-slate-600 italic mb-3">
                      <strong>Audit Finding:</strong> {finding.reasoning}
                    </p>

                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div className="bg-red-50/60 border border-red-200/80 p-3 rounded">
                        <span className="text-[10px] font-bold text-red-800 uppercase block mb-1">Original Unfavorable Term:</span>
                        <p className="text-red-950 font-sans line-through opacity-80">{finding.original_text}</p>
                      </div>

                      <div className="bg-emerald-50/60 border border-emerald-200/80 p-3 rounded">
                        <span className="text-[10px] font-bold text-emerald-800 uppercase block mb-1">DocuClear AI Counter-Redline:</span>
                        <p className="text-emerald-950 font-sans font-medium">{finding.proposed_redline}</p>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="mt-8 pt-4 border-t border-slate-200 text-[10px] text-slate-400 flex justify-between report-card">
              <span>DocuClear AI • Hack With Hyderabad 3.0 (Microsoft Campus)</span>
              <span>Confidential Enterprise Work Product • Page 1 of 1</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
